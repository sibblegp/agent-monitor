[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitor"
version = "0.1.0"
description = "Live structure & flow visualizer for AI-agent code changes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # uvicorn has no WebSocket support without a protocol library, and the live
    # update channel is the whole point of the tool.
    "websockets>=12.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
ts = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
all = ["anthropic>=0.40", "tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
dev = ["pytest>=8.0"]
# Freezing the backend for a standalone app bundle.
pkg = ["pyinstaller>=6.10"]

[project.scripts]
agent-monitor = "agent_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_monitor*"]

[tool.setuptools.package-data]
agent_monitor = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
